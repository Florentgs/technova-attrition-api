[project]
name = "technova-attrition-api"
version = "0.1.0"
description = "API de prédiction du risque de démission des employés de TechNova Partners"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost==1.2.10",
    "fastapi>=0.165.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "scikit-learn==1.9.1",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]
